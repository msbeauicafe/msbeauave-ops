<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9E9F0">
  <meta name="robots" content="noindex, nofollow">
  <title>MS BEAU AVE — Time clock</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="manifest" href="/clock/manifest.webmanifest">
  <link rel="stylesheet" href="/clock/clock.css">
</head>
<body>
  <!-- Deliberately nothing here but the clock. No menu, no links out, no way
       to wander into the till or the takings from the tablet by the door. -->
  <header id="bar">
    <div class="brand">
      <img src="/logo.jpg" alt="">
      <div>
        <b>MS BEAU AVE</b>
        <span id="where">Time clock</span>
      </div>
    </div>
    <div class="right">
      <span id="now"></span>
      <button id="leave" class="quiet" hidden>Sign out</button>
    </div>
  </header>

  <main id="app"></main>
  <div id="notices"></div>
  <script src="/clock/clock.js" type="module"></script>
</body>
</html>

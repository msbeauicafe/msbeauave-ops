<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F9E9F0">
  <meta name="robots" content="noindex, nofollow">
  <title>MS BEAU AVE — Time clock</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <!-- iPhone and iPad. There is no APK to hand out on iOS and no way to
       sideload one, so the app people install is this page added to the home
       screen: its own icon, opening full-screen with no browser bars. iOS 16.4
       and later reads that from the manifest; everything older needs the meta
       below, and plenty of the phones here are older. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MBA Clock">
  <link rel="manifest" href="/clock/manifest.webmanifest">
  <link rel="stylesheet" href="/clock/clock.css">
</head>
<body>
  <!-- Deliberately nothing here but the clock. No menu, no links out, no way
       to wander into the till or the takings from the screen by the door. -->
  <header id="bar">
    <div class="brand">
      <img src="/logo.jpg" alt="">
      <div>
        <b>MS BEAU AVE</b>
        <span id="where">Time clock</span>
      </div>
    </div>
    <!-- No sign-out here on purpose. A screen by a door is used by everybody,
         and the one control that mattered was the one that broke it. The owner
         ends this device's session from the back office. -->
    <div class="right">
      <span id="now"></span>
    </div>
  </header>

  <main id="app"></main>
  <div id="notices"></div>
  <script src="/clock/clock.js" type="module"></script>
</body>
</html>

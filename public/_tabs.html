<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>
  body { background: #fff7fa; margin: 0; padding: 22px; }
  .frame { background: #fff; border: 1px solid #f0d8e2; border-radius: 16px;
    padding: 22px 26px; max-width: 1200px; margin: 0 auto; }
  .note { display:inline-block; background:#e0245e; color:#fff; font-weight:700;
    font-size:.78rem; padding:3px 9px; border-radius:20px; margin-left:8px; }
</style></head>
<body>
  <div class="frame">
    <div class="subtabs">
      <button>Supplier information</button>
      <button>Raise order</button>
      <button class="on">Pending purchase order <span class="note">← main tab</span></button>
    </div>
    <div class="panel">
      <div class="subtabs" style="margin-top:4px">
        <button class="on">Pending orders</button>
        <button>Product list</button>
      </div>
      <div class="head" style="margin:6px 0 0"><h3>Purchase orders</h3>
        <button class="btn">＋ Raise a purchase order</button></div>
      <div class="dim mt">The rows marked <span class="tag pink">open</span> are the pending ones — click Open to work them.</div>
    </div>
  </div>
</body></html>
